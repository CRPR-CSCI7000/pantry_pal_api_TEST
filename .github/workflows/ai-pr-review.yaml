name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Debug PR Info
        run: |
          echo "PR NUMBER: ${{ github.event.pull_request.number }}"
          echo "REPOSITORY: ${{ github.repository }}"
          echo "PR URL: ${{ github.event.pull_request.html_url }}"
      
      - name: Send PR to AI reviewer
        run: |
          curl -X POST "${{ secrets.AI_REVIEWER_URL }}" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.AI_REVIEWER_API_KEY }}" \
          -d '{
            "message": "Review this PR for me.",
            "agent_config": {
              "pullRequestId": "${{ github.event.pull_request.number }}",
              "repository": "${{ github.repository }}",
              "pullRequestUrl": "${{ github.event.pull_request.html_url }}"
            }
          }'
